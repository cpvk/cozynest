services:
  db:
    image: postgres:16-alpine
    container_name: cozynest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cozynest
    ports:
      - '5432:5432'
    volumes:
      - cozynest-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cozynest']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  cozynest-db:
